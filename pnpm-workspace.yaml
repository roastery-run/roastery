packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for shared dependency versions. Referenced as
# `"catalog:"` in each package.json so React-context singletons (router,
# query, auth) resolve to one instance. https://pnpm.io/catalogs
catalog:
  "@hookform/resolvers": ^5.2.2
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-query": ^5.90.2
  "@tanstack/react-router": ^1.132.0
  "@tanstack/react-table": ^8.21.3
  "@tanstack/react-virtual": ^3.13.12
  "@tanstack/router-plugin": ^1.132.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  better-auth: ^1.3.27
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  hono: ^4.9.10
  lucide-react: ^0.544.0
  radix-ui: ^1.4.3
  react: ^19.2.0
  react-dom: ^19.2.0
  react-hook-form: ^7.64.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  typescript: ^5.9.3
  uplot: ^1.6.32
  vite: ^7.1.7
  vitest: ^3.2.4
  zod: ^4.5.4

onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
